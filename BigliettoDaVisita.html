<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biglietto da visita - Pietro Scatigna</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #E8EEF5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .business-card {
            width: 520px;
            min-height: 300px;
            padding: 38px;

            /* Sfondo principale */
            background: linear-gradient(
                135deg,
                #0B132B 0%,
                #142B44 55%,
                #1C3D5A 100%
            );

            color: #F8FAFC;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(11, 19, 43, 0.25);

            position: relative;
            overflow: hidden;
        }

        /* Cerchio decorativo superiore */
        .business-card::before {
            content: "";
            position: absolute;

            width: 210px;
            height: 210px;

            right: -90px;
            top: -90px;

            background: #38BDF8;

            border-radius: 50%;
            opacity: 0.85;
        }

        /* Secondo elemento decorativo */
        .business-card::after {
            content: "";
            position: absolute;

            width: 140px;
            height: 140px;

            right: 35px;
            bottom: -90px;

            background: #1C3D5A;

            border: 2px solid rgba(56, 189, 248, 0.5);

            border-radius: 50%;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        /* Nome */
        .name {
            font-size: 32px;
            font-weight: 700;

            letter-spacing: 1px;

            color: #F8FAFC;

            margin-bottom: 8px;
        }

        /* Ruolo */
        .role {
            color: #38BDF8;

            font-size: 15px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 2px;

            margin-bottom: 28px;
        }

        /* Linea decorativa */
        .separator {
            width: 65px;
            height: 4px;

            background: #38BDF8;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        /* Informazioni */
        .info {
            display: flex;
            align-items: center;

            gap: 13px;

            margin: 14px 0;

            font-size: 15px;

            color: #DCE7F2;
        }

        /* Icone */
        .icon {
            width: 35px;
            height: 35px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(56, 189, 248, 0.12);

            border: 1px solid rgba(56, 189, 248, 0.35);

            border-radius: 50%;

            color: #38BDF8;

            font-size: 16px;

            flex-shrink: 0;
        }

        /* Link */
        .info a {
            color: #DCE7F2;

            text-decoration: none;

            transition: 0.2s;
        }

        .info a:hover {
            color: #38BDF8;
        }

        /* Responsive */
        @media (max-width: 600px) {

            .business-card {
                width: 90%;
                padding: 30px;
            }

            .name {
                font-size: 27px;
            }

            .role {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="business-card">

        <div class="content">

            <!-- NOME E COGNOME -->
            <h1 class="name">
                Pietro Scatigna
            </h1>

            <!-- RUOLO -->
            <div class="role">
                Ingegnere di rete
            </div>

            <!-- LINEA -->
            <div class="separator"></div>

            <!-- TELEFONO -->
            <div class="info">
                <div class="icon">☎</div>

                <a href="tel:+393313702931">
                    +39 3313702931
                </a>
            </div>

            <!-- EMAIL -->
            <div class="info">
                <div class="icon">✉</div>

                <a href="mailto:pietroscatigna08@gmail.com">
                    pietroscatigna08@gmail.com
                </a>
            </div>

            <!-- INDIRIZZO -->
            <div class="info">
                <div class="icon">⌂</div>

                <span>
                    Via Piave, 28
                </span>
            </div>

            <!-- CITTÀ -->
            <div class="info">
                <div class="icon">⌖</div>

                <span>
                    Fasano (BR), Italia
                </span>
            </div>

        </div>

    </div>

</body>
</html>
